<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" opacity="0.3" />
    </pattern>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 10s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .flow-pulse {
        animation: pulseLine 4s linear infinite;
      }
      .signal-dot-1 {
        animation: signalTravel1 5s ease-in-out infinite;
      }
      .signal-dot-2 {
        animation: signalTravel2 6s ease-in-out infinite 1.5s;
      }
      .signal-dot-3 {
        animation: signalTravel3 7s ease-in-out infinite 0.8s;
      }
      .pill-float {
        animation: gentleHover 6s ease-in-out infinite alternate;
      }

      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        100% { transform: translate(80px, 40px) scale(1.2); opacity: 0.55; }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1.1); opacity: 0.3; }
        100% { transform: translate(-60px, -30px) scale(0.9); opacity: 0.5; }
      }
      @keyframes pulseLine {
        0% { stroke-dashoffset: 200; opacity: 0.2; }
        50% { opacity: 0.7; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes signalTravel1 {
        0% { cx: 80; cy: 70; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { cx: 1120; cy: 70; opacity: 0; }
      }
      @keyframes signalTravel2 {
        0% { cx: 1120; cy: 300; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { cx: 80; cy: 300; opacity: 0; }
      }
      @keyframes signalTravel3 {
        0% { cx: 120; cy: 320; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { cx: 1080; cy: 320; opacity: 0; }
      }
      @keyframes gentleHover {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Blobs in Background -->
  <g filter="url(#glow)">
    <circle class="glow-orb-1" cx="240" cy="110" r="130" fill="#38bdf8" />
    <circle class="glow-orb-2" cx="960" cy="220" r="140" fill="#a855f7" />
  </g>

  <!-- Tech Blueprint Grid -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Circuit / Telemetry Routing Lines (Background layer) -->
  <g fill="none" stroke-linecap="round">
    <path d="M 60 70 L 400 70 L 460 110 L 740 110 L 800 70 L 1140 70" stroke="#38bdf8" stroke-width="1.5" opacity="0.35" stroke-dasharray="8 6" class="flow-pulse" />
    <path d="M 60 300 L 340 300 L 420 260 L 780 260 L 860 300 L 1140 300" stroke="#a855f7" stroke-width="1.5" opacity="0.35" stroke-dasharray="10 6" class="flow-pulse" />
    <path d="M 120 320 L 1080 320" stroke="#818cf8" stroke-width="1" opacity="0.2" stroke-dasharray="4 8" />

    <!-- Animated Data Signal Particles -->
    <circle class="signal-dot-1" cx="80" cy="70" r="3.5" fill="#38bdf8" filter="url(#glow)" />
    <circle class="signal-dot-2" cx="1120" cy="300" r="3.5" fill="#c084fc" filter="url(#glow)" />
    <circle class="signal-dot-3" cx="120" cy="320" r="2.5" fill="#818cf8" />
  </g>

  <!-- Decorative Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 28 44 L 28 28 L 44 28" />
    <path d="M 1172 44 L 1172 28 L 1156 28" />
    <path d="M 28 316 L 28 332 L 44 332" />
    <path d="M 1172 316 L 1172 332 L 1156 332" />
  </g>

  <!-- Foreground Content Container: Fully Centered & Crisp Foreground Contrast -->
  <!-- Top Tag Pill -->
  <g class="pill-float" transform="translate(0, 0)">
    <rect x="420" y="32" width="360" height="32" rx="16" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle cx="438" cy="48" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="454" y="53" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE &amp; OPEN-SOURCE ECOSYSTEM</text>
  </g>

  <!-- Primary Main Title (Foreground) -->
  <!-- Crisp drop shadow for maximum foreground contrast against dynamic glows -->
  <text x="600" y="145" text-anchor="middle" fill="#030712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="0.5" opacity="0.8" dy="3">Customer Service Management</text>
  <text x="600" y="145" text-anchor="middle" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="0.5">Customer Service Management</text>

  <!-- Subtitle (Foreground) -->
  <text x="600" y="186" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
    The Curated Hub for Helpdesk, Omnichannel Support, Shared Inboxes &amp; Service Operations
  </text>

  <!-- Dynamic Capability Floating Badges / Tags (Foreground) -->
  <g class="pill-float" transform="translate(0, 0)">
    <!-- Pill 1: Ticketing -->
    <rect x="220" y="222" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="238" cy="238" r="4" fill="#38bdf8" />
    <text x="252" y="243" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Ticketing &amp; SLAs</text>

    <!-- Pill 2: Omnichannel -->
    <rect x="396" y="222" width="180" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="414" cy="238" r="4" fill="#818cf8" />
    <text x="428" y="243" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Omnichannel &amp; Chat</text>

    <!-- Pill 3: AI Agents -->
    <rect x="592" y="222" width="188" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="610" cy="238" r="4" fill="#c084fc" />
    <text x="624" y="243" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">AI Agents &amp; Deflection</text>

    <!-- Pill 4: Open Source -->
    <rect x="796" y="222" width="184" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="814" cy="238" r="4" fill="#34d399" />
    <text x="828" y="243" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Self-Hosted / FOSS</text>
  </g>

  <!-- Bottom Ecosystem Stats Banner -->
  <g transform="translate(360, 280)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      <tspan fill="#38bdf8" font-weight="700">★ 18+</tspan> Open-Source Projects   |   
      <tspan fill="#818cf8" font-weight="700">★ 10</tspan> Enterprise Leaders   |   
      <tspan fill="#34d399" font-weight="700">★ 100%</tspan> Verified Pricing &amp; Metrics
    </text>
  </g>
</svg>
